blueprint:
  name: HomeLabNext – Fenster-offen-Erinnerung v0.1.0
  description: >-
    Meldet je Fenster, wenn es ununterbrochen länger als die eingestellte
    Offenzeit offen ist. Optionale Wiederholungen enden beim Schließen oder
    bei unknown/unavailable. Keine Helper erforderlich. Nach HA-Neustart oder
    Neuladen der Automationen starten keine alten Wartezeiten oder
    Wiederholungen weiter; bereits offene Fenster müssen erneut einen
    Zustandswechsel nach on melden. Kontakte: on = offen, off = geschlossen.
  domain: automation
  source_url: https://github.com/homelabnext/home-assistant/blob/main/blueprints/automation/window_open_notification/window_open_notification.yaml
  input:
    window_contacts:
      name: Fensterkontakte
      description: >-
        Ein oder mehrere einzelne Kontakte. Jeder Kontakt wird unabhängig
        überwacht. Keine Kontaktgruppe verwenden, wenn du einzelne Namen
        und Offenzeiten erhalten möchtest.
      selector:
        entity:
          multiple: true
          filter:
            - domain: binary_sensor
    open_minutes:
      name: Erste Meldung nach (Minuten)
      description: Das Fenster muss so lange ohne Unterbrechung offen sein.
      default: 15
      selector:
        number:
          min: 1
          max: 1440
          step: 1
          mode: box
          unit_of_measurement: min
    repeat_enabled:
      name: Erinnerung wiederholen
      description: Wiederholt die Meldung, solange dieses Fenster weiter offen ist.
      default: false
      selector:
        boolean: {}
    repeat_minutes:
      name: Wiederholen alle (Minuten)
      description: Abstand nach der ersten Meldung. Nur bei aktivierter Wiederholung.
      default: 15
      selector:
        number:
          min: 1
          max: 1440
          step: 1
          mode: box
          unit_of_measurement: min
    notification_script:
      name: Zentrales Notify-Skript
      description: Nimmt die Variablen title und message an.
      default: script.home_notification
      selector:
        entity:
          filter:
            - domain: script
    notification_title:
      name: Titel der Benachrichtigung
      default: "🪟 Fenster noch offen"

# Independent runs: opening another window must not cancel an existing reminder.
mode: parallel
max: 100

triggers:
  - trigger: state
    entity_id: !input window_contacts
    to: "on"
    for:
      minutes: !input open_minutes
    id: window_open

# The guard is inside actions too, so manual action execution sends no false alert.
conditions: []

actions:
  - condition: template
    value_template: >-
      {{ trigger is defined and trigger is mapping
         and trigger.get('platform') == 'state'
         and trigger.get('id') == 'window_open'
         and trigger.get('to_state') is not none }}
  - variables:
      window_entity: "{{ trigger.entity_id }}"
      opening_id: "{{ trigger.to_state.last_changed.isoformat() }}"
      repeat_notifications: !input repeat_enabled
  - repeat:
      while:
        - condition: template
          value_template: >-
            {{ is_state(window_entity, 'on')
               and states[window_entity].last_changed.isoformat() == opening_id }}
      sequence:
        - action: script.turn_on
          target:
            entity_id: !input notification_script
          data:
            variables:
              title: !input notification_title
              message: >-
                {% set minutes = ((as_timestamp(now()) -
                  as_timestamp(states[window_entity].last_changed)) / 60) | int %}
                {{ state_attr(window_entity, 'friendly_name') or window_entity }}
                ist seit {{ minutes }} Minuten offen. Bitte schließen.
        - if:
            - condition: template
              value_template: "{{ not repeat_notifications }}"
          then:
            - stop: Einmalige Erinnerung gesendet.
        # Watching the opening timestamp also catches a rapid close/reopen.
        - wait_template: >-
            {{ not is_state(window_entity, 'on')
               or states[window_entity].last_changed.isoformat() != opening_id }}
          timeout:
            minutes: !input repeat_minutes
          continue_on_timeout: true
        - if:
            - condition: template
              value_template: "{{ wait.completed }}"
          then:
            - stop: Fenster geschlossen, Zustand ungültig oder neuer Öffnungsvorgang.
