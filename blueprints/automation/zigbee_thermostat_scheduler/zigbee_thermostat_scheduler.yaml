blueprint:
  name: "HomeLabNext – Zigbee Thermostat Scheduler v0.7.0"
  description: >
    Steuert Climate-Entitäten mit bis zu drei Tagesprofilen. Jedem Profil
    können einzelne Wochentage und bis zu zwei Zeitfenster zugewiesen werden.
    Temperaturen bleiben direkt einstellbar. Ein optionaler input_select
    erlaubt das Umschalten zwischen Aus, Auto und Manuell. Fensterkontakt,
    Alarmo-Urlaub, Anwesenheitsregel und ein zeitlich begrenzter manueller
    Thermostat-Override sind optional.
  domain: automation
  source_url: https://github.com/homelabnext/home-assistant/blob/main/blueprints/automation/zigbee_thermostat_scheduler/zigbee_thermostat_scheduler.yaml
  homeassistant:
    min_version: "2024.6.0"

  input:
    thermostat_section:
      name: Thermostat
      icon: mdi:thermostat
      input:
        thermostat_entities:
          name: Thermostat-Entitäten
          description: Eine oder mehrere Climate-Entitäten.
          selector:
            entity:
              multiple: true
              filter:
                - domain: climate

    operation_section:
      name: Betriebsart und Temperaturen
      icon: mdi:thermostat-box
      input:
        default_mode:
          name: Betriebsart
          description: >
            Auto nutzt Zeitplan und optionale Anwesenheitsregel. Manuell nutzt
            die manuelle Temperatur. Aus schaltet die Thermostate aus.
            Dies ist der feste Modus dieser Automation. Für Umschaltung zur
            Laufzeit den optionalen Modus-Helfer aktivieren.
          default: Auto
          selector:
            select:
              options:
                - Auto
                - Manuell
                - Aus
              mode: dropdown
        use_mode_helper:
          name: Laufzeit-Umschaltung mit input_select verwenden
          description: Aktivieren, wenn der Modus über Dashboard oder Sprache umgeschaltet werden soll.
          default: false
          selector:
            boolean:
        mode_helper:
          name: Optionaler Modus-Helfer
          description: input_select mit exakt den Optionen Aus, Auto und Manuell. Nur bei aktivierter Laufzeit-Umschaltung verwenden.
          default: ""
          selector:
            entity:
              filter:
                - domain: input_select
        comfort_temperature:
          name: Komforttemperatur
          default: 22
          selector:
            number:
              min: 5
              max: 30
              step: 0.5
              unit_of_measurement: "°C"
              mode: box
        setback_temperature:
          name: Absenktemperatur
          default: 20
          selector:
            number:
              min: 5
              max: 30
              step: 0.5
              unit_of_measurement: "°C"
              mode: box
        manual_temperature:
          name: Manuelle Temperatur
          default: 21
          selector:
            number:
              min: 5
              max: 30
              step: 0.5
              unit_of_measurement: "°C"
              mode: box

    schedule_section:
      name: Wochenzeitplan – Tagesprofile
      icon: mdi:calendar-clock
      input:
        profile_1_days:
          name: Profil 1 – Wochentage
          description: Erste Auswahl hat Vorrang, wenn ein Tag versehentlich mehrfach zugeordnet wird.
          default: ["mon", "tue", "wed", "thu", "fri"]
          selector:
            select:
              multiple: true
              mode: dropdown
              options:
                - label: Montag
                  value: mon
                - label: Dienstag
                  value: tue
                - label: Mittwoch
                  value: wed
                - label: Donnerstag
                  value: thu
                - label: Freitag
                  value: fri
                - label: Samstag
                  value: sat
                - label: Sonntag
                  value: sun
        profile_1_start:
          name: Profil 1 – Zeitfenster Beginn
          default: "06:00:00"
          selector:
            time:
        profile_1_end:
          name: Profil 1 – Zeitfenster Ende
          default: "22:00:00"
          selector:
            time:
        profile_1_second_window_enabled:
          name: Profil 1 – zweites Zeitfenster aktivieren
          default: false
          selector:
            boolean:
        profile_1_second_start:
          name: Profil 1 – zweites Zeitfenster Beginn
          default: "16:00:00"
          selector:
            time:
        profile_1_second_end:
          name: Profil 1 – zweites Zeitfenster Ende
          default: "22:00:00"
          selector:
            time:

        profile_2_days:
          name: Profil 2 – Wochentage
          default: ["sat", "sun"]
          selector:
            select:
              multiple: true
              mode: dropdown
              options:
                - label: Montag
                  value: mon
                - label: Dienstag
                  value: tue
                - label: Mittwoch
                  value: wed
                - label: Donnerstag
                  value: thu
                - label: Freitag
                  value: fri
                - label: Samstag
                  value: sat
                - label: Sonntag
                  value: sun
        profile_2_start:
          name: Profil 2 – Zeitfenster Beginn
          default: "08:00:00"
          selector:
            time:
        profile_2_end:
          name: Profil 2 – Zeitfenster Ende
          default: "23:00:00"
          selector:
            time:
        profile_2_second_window_enabled:
          name: Profil 2 – zweites Zeitfenster aktivieren
          default: false
          selector:
            boolean:
        profile_2_second_start:
          name: Profil 2 – zweites Zeitfenster Beginn
          default: "16:00:00"
          selector:
            time:
        profile_2_second_end:
          name: Profil 2 – zweites Zeitfenster Ende
          default: "23:00:00"
          selector:
            time:

        profile_3_days:
          name: Profil 3 – Wochentage (optional)
          description: Leer lassen, wenn du nur zwei Profile benötigst.
          default: []
          selector:
            select:
              multiple: true
              mode: dropdown
              options:
                - label: Montag
                  value: mon
                - label: Dienstag
                  value: tue
                - label: Mittwoch
                  value: wed
                - label: Donnerstag
                  value: thu
                - label: Freitag
                  value: fri
                - label: Samstag
                  value: sat
                - label: Sonntag
                  value: sun
        profile_3_start:
          name: Profil 3 – Zeitfenster Beginn
          default: "06:00:00"
          selector:
            time:
        profile_3_end:
          name: Profil 3 – Zeitfenster Ende
          default: "22:00:00"
          selector:
            time:
        profile_3_second_window_enabled:
          name: Profil 3 – zweites Zeitfenster aktivieren
          default: false
          selector:
            boolean:
        profile_3_second_start:
          name: Profil 3 – zweites Zeitfenster Beginn
          default: "16:00:00"
          selector:
            time:
        profile_3_second_end:
          name: Profil 3 – zweites Zeitfenster Ende
          default: "22:00:00"
          selector:
            time:

    manual_override_section:
      name: Manuelle Thermostat-Übersteuerung
      icon: mdi:hand-thermometer
      collapsed: true
      input:
        manual_override_until_helper:
          name: Override-Ablaufzeit
          description: >-
            Optionaler input_datetime-Helper mit Datum UND Uhrzeit. Wenn
            ausgewählt, werden manuelle Sollwert- oder Betriebsartänderungen
            für die eingestellte Dauer nicht vom Zeitplan überschrieben.
          default: ""
          selector:
            entity:
              filter:
                - domain: input_datetime
        manual_override_hours:
          name: Override-Dauer
          default: 2
          selector:
            number:
              min: 0.5
              max: 24
              step: 0.5
              unit_of_measurement: h
              mode: box

    protection_section:
      name: Fenster und Urlaub (optional)
      icon: mdi:shield-home
      input:
        window_contacts:
          name: Fensterkontakte
          description: Bei mindestens einem offenen Kontakt gilt die Fenster-Temperatur.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: binary_sensor
        window_open_temperature:
          name: Temperatur bei offenem Fenster
          default: 7
          selector:
            number:
              min: 5
              max: 12
              step: 0.5
              unit_of_measurement: "°C"
              mode: box
        vacation_enabled:
          name: Alarmo-Urlaubsmodus verwenden
          default: false
          selector:
            boolean:
        vacation_alarm:
          name: Alarmo-Entität
          description: Bei Zustand armed_vacation gilt die Frostschutztemperatur.
          default: ""
          selector:
            entity:
              filter:
                - domain: alarm_control_panel
        vacation_temperature:
          name: Frostschutztemperatur im Urlaubsmodus
          default: 7
          selector:
            number:
              min: 5
              max: 12
              step: 0.5
              unit_of_measurement: "°C"
              mode: box

    presence_section:
      name: Anwesenheit und Homeoffice (optional)
      icon: mdi:account-check
      collapsed: true
      input:
        presence_rule_enabled:
          name: Anwesenheitsregel aktivieren
          description: Komfort gilt bei mindestens einer Person zuhause und Leistung über dem Schwellwert.
          default: false
          selector:
            boolean:
        presence_rule_schedule_only:
          name: Anwesenheitsregel nur im Zeitplan anwenden
          default: true
          selector:
            boolean:
        person_entities:
          name: Personen
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: person
        power_sensor:
          name: Leistungs-Sensor in Watt
          default: ""
          selector:
            entity:
              filter:
                - domain: sensor
                  device_class: power
        power_threshold:
          name: Leistungsschwellwert
          default: 100
          selector:
            number:
              min: 0
              max: 5000
              step: 10
              unit_of_measurement: W
              mode: box

    refresh_section:
      name: Aktualisierung
      icon: mdi:timer-outline
      collapsed: true
      input:
        refresh_interval:
          name: Prüfintervall
          description: >
            Die Automation prüft den Zustand regelmäßig. Dadurch reagieren
            Änderungen spätestens nach diesem Intervall; kürzere Intervalle
            erhöhen die Zahl der Prüfungen.
          default: "/1"
          selector:
            select:
              options:
                - label: Jede Minute
                  value: "/1"
                - label: Alle 5 Minuten
                  value: "/5"
                - label: Alle 10 Minuten
                  value: "/10"

mode: queued
max: 50
max_exceeded: silent

variables:
  default_mode: !input default_mode
  use_mode_helper: !input use_mode_helper
  mode_helper: !input mode_helper
  profile_1_days: !input profile_1_days
  profile_1_start: !input profile_1_start
  profile_1_end: !input profile_1_end
  profile_1_second_window_enabled: !input profile_1_second_window_enabled
  profile_1_second_start: !input profile_1_second_start
  profile_1_second_end: !input profile_1_second_end
  profile_2_days: !input profile_2_days
  profile_2_start: !input profile_2_start
  profile_2_end: !input profile_2_end
  profile_2_second_window_enabled: !input profile_2_second_window_enabled
  profile_2_second_start: !input profile_2_second_start
  profile_2_second_end: !input profile_2_second_end
  profile_3_days: !input profile_3_days
  profile_3_start: !input profile_3_start
  profile_3_end: !input profile_3_end
  profile_3_second_window_enabled: !input profile_3_second_window_enabled
  profile_3_second_start: !input profile_3_second_start
  profile_3_second_end: !input profile_3_second_end
  manual_override_until_helper: !input manual_override_until_helper
  manual_override_hours: !input manual_override_hours
  window_contacts: !input window_contacts
  vacation_enabled: !input vacation_enabled
  vacation_alarm: !input vacation_alarm
  vacation_temperature: !input vacation_temperature
  window_open_temperature: !input window_open_temperature
  comfort_temperature: !input comfort_temperature
  setback_temperature: !input setback_temperature
  manual_temperature: !input manual_temperature
  presence_rule_enabled: !input presence_rule_enabled
  presence_rule_schedule_only: !input presence_rule_schedule_only
  person_entities: !input person_entities
  power_sensor: !input power_sensor
  power_threshold: !input power_threshold

  current_mode: >-
    {{ states(mode_helper) if use_mode_helper and mode_helper != ''
       and has_value(mode_helper) else default_mode }}
  manual_override_active: >-
    {{ manual_override_until_helper != ''
       and has_value(manual_override_until_helper)
       and (as_timestamp(states(manual_override_until_helper), default=0)
            > as_timestamp(now())) }}
  manual_change_detected: >-
    {{ manual_override_until_helper != ''
       and trigger is defined and trigger.id == 'thermostat_changed'
       and trigger.from_state is not none
       and trigger.to_state is not none
       and trigger.from_state.state not in ['unknown', 'unavailable']
       and trigger.to_state.state not in ['unknown', 'unavailable']
       and trigger.to_state.context.parent_id is none
       and (
         trigger.from_state.state != trigger.to_state.state
         or trigger.from_state.attributes.get('temperature')
            != trigger.to_state.attributes.get('temperature')
         or trigger.from_state.attributes.get('target_temp_low')
            != trigger.to_state.attributes.get('target_temp_low')
         or trigger.from_state.attributes.get('target_temp_high')
            != trigger.to_state.attributes.get('target_temp_high')
         or trigger.from_state.attributes.get('preset_mode')
            != trigger.to_state.attributes.get('preset_mode')
       ) }}
  scheduled_now: >-
    {% set day_names = ['mon', 'tue', 'wed', 'thu', 'fri', 'sat', 'sun'] %}
    {% set today = day_names[now().weekday()] %}
    {% set yesterday = day_names[(now().weekday() - 1) % 7] %}
    {% set current = now().strftime('%H:%M:%S') %}
    {% set profiles = [
      {'days': profile_1_days, 'start': profile_1_start, 'end': profile_1_end,
       'second': profile_1_second_window_enabled,
       'second_start': profile_1_second_start, 'second_end': profile_1_second_end},
      {'days': profile_2_days, 'start': profile_2_start, 'end': profile_2_end,
       'second': profile_2_second_window_enabled,
       'second_start': profile_2_second_start, 'second_end': profile_2_second_end},
      {'days': profile_3_days, 'start': profile_3_start, 'end': profile_3_end,
       'second': profile_3_second_window_enabled,
       'second_start': profile_3_second_start, 'second_end': profile_3_second_end}
    ] %}
    {% set today_profile_index = namespace(value=-1) %}
    {% set yesterday_profile_index = namespace(value=-1) %}
    {% for profile in profiles %}
      {% if today in profile['days'] and today_profile_index.value == -1 %}
        {% set today_profile_index.value = loop.index0 %}
      {% endif %}
      {% if yesterday in profile['days'] and yesterday_profile_index.value == -1 %}
        {% set yesterday_profile_index.value = loop.index0 %}
      {% endif %}
    {% endfor %}
    {% set today_profile =
      profiles[today_profile_index.value]
      if today_profile_index.value >= 0 else none %}
    {% set yesterday_profile =
      profiles[yesterday_profile_index.value]
      if yesterday_profile_index.value >= 0 else none %}
    {% set first_now = today_profile is not none and (
      (today_profile['start'] <= today_profile['end']
       and today_profile['start'] <= current < today_profile['end'])
      or (today_profile['start'] > today_profile['end']
          and current >= today_profile['start'])) %}
    {% set second_now = today_profile is not none
      and today_profile['second'] and (
      (today_profile['second_start'] <= today_profile['second_end']
       and today_profile['second_start'] <= current < today_profile['second_end'])
      or (today_profile['second_start'] > today_profile['second_end']
          and current >= today_profile['second_start'])) %}
    {% set first_after_midnight = yesterday_profile is not none
      and yesterday_profile['start'] > yesterday_profile['end']
      and current < yesterday_profile['end'] %}
    {% set second_after_midnight = yesterday_profile is not none
      and yesterday_profile['second']
      and yesterday_profile['second_start'] > yesterday_profile['second_end']
      and current < yesterday_profile['second_end'] %}
    {{ first_now or second_now or first_after_midnight or second_after_midnight }}
  office_presence_active: >-
    {{ expand(person_entities)
       | selectattr('state', 'eq', 'home') | list | count > 0
       and power_sensor != '' and has_value(power_sensor)
       and (states(power_sensor) | float(0)) > (power_threshold | float) }}
  use_comfort_temperature: >-
    {{ (scheduled_now | bool and
        (not presence_rule_enabled or office_presence_active | bool))
       or (presence_rule_enabled and not presence_rule_schedule_only
           and office_presence_active | bool) }}

triggers:
  - trigger: state
    entity_id: !input thermostat_entities
    id: thermostat_changed

  - trigger: homeassistant
    event: start
    id: startup
  - trigger: time_pattern
    minutes: !input refresh_interval
    id: periodic_refresh

actions:
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ manual_change_detected }}"
        sequence:
          - action: input_datetime.set_datetime
            target:
              entity_id: "{{ manual_override_until_helper }}"
            data:
              datetime: >-
                {{ (now() + timedelta(hours=manual_override_hours | float(2)))
                   .strftime('%Y-%m-%d %H:%M:%S') }}
          - stop: Manuelle Thermostatänderung – Override wurde aktiviert.

      - conditions:
          - condition: trigger
            id: thermostat_changed
        sequence:
          - stop: Thermostat-Zustandsänderung ohne manuelle Sollwertänderung ignoriert.

      - conditions:
          - condition: template
            value_template: >-
              {{ vacation_enabled and vacation_alarm != ''
                 and is_state(vacation_alarm, 'armed_vacation') }}
        sequence:
          - action: climate.set_hvac_mode
            target:
              entity_id: !input thermostat_entities
            data:
              hvac_mode: heat
          - action: climate.set_temperature
            target:
              entity_id: !input thermostat_entities
            data:
              temperature: "{{ vacation_temperature | float }}"

      - conditions:
          - condition: template
            value_template: "{{ current_mode == 'Aus' }}"
        sequence:
          - action: climate.set_hvac_mode
            target:
              entity_id: !input thermostat_entities
            data:
              hvac_mode: off

      - conditions:
          - condition: template
            value_template: >-
              {{ expand(window_contacts) | selectattr('state', 'eq', 'on')
                 | list | count > 0 }}
        sequence:
          - action: climate.set_hvac_mode
            target:
              entity_id: !input thermostat_entities
            data:
              hvac_mode: heat
          - action: climate.set_temperature
            target:
              entity_id: !input thermostat_entities
            data:
              temperature: "{{ window_open_temperature | float }}"

      - conditions:
          - condition: template
            value_template: "{{ manual_override_active }}"
        sequence:
          - stop: Manueller Override ist noch aktiv.

      - conditions:
          - condition: template
            value_template: "{{ current_mode == 'Manuell' }}"
        sequence:
          - action: climate.set_hvac_mode
            target:
              entity_id: !input thermostat_entities
            data:
              hvac_mode: heat
          - action: climate.set_temperature
            target:
              entity_id: !input thermostat_entities
            data:
              temperature: "{{ manual_temperature | float }}"

      - conditions:
          - condition: template
            value_template: "{{ current_mode == 'Auto' and use_comfort_temperature }}"
        sequence:
          - action: climate.set_hvac_mode
            target:
              entity_id: !input thermostat_entities
            data:
              hvac_mode: heat
          - action: climate.set_temperature
            target:
              entity_id: !input thermostat_entities
            data:
              temperature: "{{ comfort_temperature | float }}"

      - conditions:
          - condition: template
            value_template: "{{ current_mode == 'Auto' and not use_comfort_temperature }}"
        sequence:
          - action: climate.set_hvac_mode
            target:
              entity_id: !input thermostat_entities
            data:
              hvac_mode: heat
          - action: climate.set_temperature
            target:
              entity_id: !input thermostat_entities
            data:
              temperature: "{{ setback_temperature | float }}"
