blueprint:
  name: "HomeLabNext – Zigbee Thermostat Scheduler v0.6.0"
  description: >
    Steuert Climate-Entitäten mit getrennten Zeitfenstern für Wochentage
    und Wochenenden sowie direkt einstellbaren Temperaturen. Ein optionaler
    input_select erlaubt
    zusätzlich das Umschalten zwischen Aus, Auto und Manuell über Dashboard
    oder Sprachsteuerung. Fensterkontakt, Alarmo-Urlaub und Anwesenheitsregel
    sind optional.
  domain: automation
  source_url: https://github.com/homelabnext/home-assistant/blob/main/blueprints/automation/zigbee_thermostat_scheduler/zigbee_thermostat_scheduler.yaml
  homeassistant:
    min_version: "2024.6.0"

  input:
    thermostat_section:
      name: Thermostat
      icon: mdi:thermostat
      input:
        thermostat_entities:
          name: Thermostat-Entitäten
          description: Eine oder mehrere Climate-Entitäten.
          selector:
            entity:
              multiple: true
              filter:
                - domain: climate

    operation_section:
      name: Betriebsart und Temperaturen
      icon: mdi:thermostat-box
      input:
        default_mode:
          name: Betriebsart
          description: >
            Auto nutzt Zeitplan und optionale Anwesenheitsregel. Manuell nutzt
            die manuelle Temperatur. Aus schaltet die Thermostate aus.
            Dies ist der feste Modus dieser Automation. Für Umschaltung zur
            Laufzeit den optionalen Modus-Helfer aktivieren.
          default: Auto
          selector:
            select:
              options:
                - Auto
                - Manuell
                - Aus
              mode: dropdown
        use_mode_helper:
          name: Laufzeit-Umschaltung mit input_select verwenden
          description: Aktivieren, wenn der Modus über Dashboard oder Sprache umgeschaltet werden soll.
          default: false
          selector:
            boolean:
        mode_helper:
          name: Optionaler Modus-Helfer
          description: input_select mit exakt den Optionen Aus, Auto und Manuell. Nur bei aktivierter Laufzeit-Umschaltung verwenden.
          default: ""
          selector:
            entity:
              filter:
                - domain: input_select
        comfort_temperature:
          name: Komforttemperatur
          default: 22
          selector:
            number:
              min: 5
              max: 30
              step: 0.5
              unit_of_measurement: "°C"
              mode: box
        setback_temperature:
          name: Absenktemperatur
          default: 20
          selector:
            number:
              min: 5
              max: 30
              step: 0.5
              unit_of_measurement: "°C"
              mode: box
        manual_temperature:
          name: Manuelle Temperatur
          default: 21
          selector:
            number:
              min: 5
              max: 30
              step: 0.5
              unit_of_measurement: "°C"
              mode: box

    schedule_section:
      name: Wochenzeitplan
      icon: mdi:calendar-clock
      input:
        weekday_start:
          name: Wochentage – Zeitfenster Beginn
          default: "06:00:00"
          selector:
            time:
        weekday_end:
          name: Wochentage – Zeitfenster Ende
          default: "22:00:00"
          selector:
            time:
        weekday_second_window_enabled:
          name: Wochentage – zweites Zeitfenster aktivieren
          default: false
          selector:
            boolean:
        weekday_second_start:
          name: Wochentage – zweites Zeitfenster Beginn
          default: "16:00:00"
          selector:
            time:
        weekday_second_end:
          name: Wochentage – zweites Zeitfenster Ende
          default: "22:00:00"
          selector:
            time:
        weekend_start:
          name: Wochenende – Zeitfenster Beginn
          default: "08:00:00"
          selector:
            time:
        weekend_end:
          name: Wochenende – Zeitfenster Ende
          default: "23:00:00"
          selector:
            time:
        weekend_second_window_enabled:
          name: Wochenende – zweites Zeitfenster aktivieren
          default: false
          selector:
            boolean:
        weekend_second_start:
          name: Wochenende – zweites Zeitfenster Beginn
          default: "16:00:00"
          selector:
            time:
        weekend_second_end:
          name: Wochenende – zweites Zeitfenster Ende
          default: "23:00:00"
          selector:
            time:

    protection_section:
      name: Fenster und Urlaub (optional)
      icon: mdi:shield-home
      input:
        window_contacts:
          name: Fensterkontakte
          description: Bei mindestens einem offenen Kontakt gilt die Fenster-Temperatur.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: binary_sensor
        window_open_temperature:
          name: Temperatur bei offenem Fenster
          default: 7
          selector:
            number:
              min: 5
              max: 12
              step: 0.5
              unit_of_measurement: "°C"
              mode: box
        vacation_enabled:
          name: Alarmo-Urlaubsmodus verwenden
          default: false
          selector:
            boolean:
        vacation_alarm:
          name: Alarmo-Entität
          description: Bei Zustand armed_vacation gilt die Frostschutztemperatur.
          default: ""
          selector:
            entity:
              filter:
                - domain: alarm_control_panel
        vacation_temperature:
          name: Frostschutztemperatur im Urlaubsmodus
          default: 7
          selector:
            number:
              min: 5
              max: 12
              step: 0.5
              unit_of_measurement: "°C"
              mode: box

    presence_section:
      name: Anwesenheit und Homeoffice (optional)
      icon: mdi:account-check
      collapsed: true
      input:
        presence_rule_enabled:
          name: Anwesenheitsregel aktivieren
          description: Komfort gilt bei mindestens einer Person zuhause und Leistung über dem Schwellwert.
          default: false
          selector:
            boolean:
        presence_rule_schedule_only:
          name: Anwesenheitsregel nur im Zeitplan anwenden
          default: true
          selector:
            boolean:
        person_entities:
          name: Personen
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: person
        power_sensor:
          name: Leistungs-Sensor in Watt
          default: ""
          selector:
            entity:
              filter:
                - domain: sensor
                  device_class: power
        power_threshold:
          name: Leistungsschwellwert
          default: 100
          selector:
            number:
              min: 0
              max: 5000
              step: 10
              unit_of_measurement: W
              mode: box

    refresh_section:
      name: Aktualisierung
      icon: mdi:timer-outline
      collapsed: true
      input:
        refresh_interval:
          name: Prüfintervall
          description: >
            Die Automation prüft den Zustand regelmäßig. Dadurch reagieren
            Änderungen spätestens nach diesem Intervall; kürzere Intervalle
            erhöhen die Zahl der Prüfungen.
          default: "/1"
          selector:
            select:
              options:
                - label: Jede Minute
                  value: "/1"
                - label: Alle 5 Minuten
                  value: "/5"
                - label: Alle 10 Minuten
                  value: "/10"

mode: restart
max_exceeded: silent

variables:
  default_mode: !input default_mode
  use_mode_helper: !input use_mode_helper
  mode_helper: !input mode_helper
  weekday_start: !input weekday_start
  weekday_end: !input weekday_end
  weekday_second_window_enabled: !input weekday_second_window_enabled
  weekday_second_start: !input weekday_second_start
  weekday_second_end: !input weekday_second_end
  weekend_start: !input weekend_start
  weekend_end: !input weekend_end
  weekend_second_window_enabled: !input weekend_second_window_enabled
  weekend_second_start: !input weekend_second_start
  weekend_second_end: !input weekend_second_end
  window_contacts: !input window_contacts
  vacation_enabled: !input vacation_enabled
  vacation_alarm: !input vacation_alarm
  vacation_temperature: !input vacation_temperature
  window_open_temperature: !input window_open_temperature
  comfort_temperature: !input comfort_temperature
  setback_temperature: !input setback_temperature
  manual_temperature: !input manual_temperature
  presence_rule_enabled: !input presence_rule_enabled
  presence_rule_schedule_only: !input presence_rule_schedule_only
  person_entities: !input person_entities
  power_sensor: !input power_sensor
  power_threshold: !input power_threshold

  current_mode: >-
    {{ states(mode_helper) if use_mode_helper and mode_helper != ''
       and has_value(mode_helper) else default_mode }}
  scheduled_now: >-
    {% set current = now().strftime('%H:%M:%S') %}
    {% set is_weekday = now().weekday() < 5 %}
    {% set is_weekend = now().weekday() >= 5 %}
    {% set weekday_first =
      (is_weekday and (
        (weekday_start <= weekday_end and weekday_start <= current < weekday_end)
        or (weekday_start > weekday_end and current >= weekday_start)))
      or (weekday_start > weekday_end and now().weekday() in [1, 2, 3, 4, 5]
          and current < weekday_end) %}
    {% set weekday_second = weekday_second_window_enabled and (
      (is_weekday and (
        (weekday_second_start <= weekday_second_end
         and weekday_second_start <= current < weekday_second_end)
        or (weekday_second_start > weekday_second_end
            and current >= weekday_second_start)))
      or (weekday_second_start > weekday_second_end
          and now().weekday() in [1, 2, 3, 4, 5]
          and current < weekday_second_end)) %}
    {% set weekend_first =
      (is_weekend and (
        (weekend_start <= weekend_end and weekend_start <= current < weekend_end)
        or (weekend_start > weekend_end and current >= weekend_start)))
      or (weekend_start > weekend_end and now().weekday() == 0
          and current < weekend_end) %}
    {% set weekend_second = weekend_second_window_enabled and (
      (is_weekend and (
        (weekend_second_start <= weekend_second_end
         and weekend_second_start <= current < weekend_second_end)
        or (weekend_second_start > weekend_second_end
            and current >= weekend_second_start)))
      or (weekend_second_start > weekend_second_end
          and now().weekday() == 0 and current < weekend_second_end)) %}
    {{ weekday_first or weekday_second or weekend_first or weekend_second }}
  office_presence_active: >-
    {{ expand(person_entities)
       | selectattr('state', 'eq', 'home') | list | count > 0
       and power_sensor != '' and has_value(power_sensor)
       and (states(power_sensor) | float(0)) > (power_threshold | float) }}
  use_comfort_temperature: >-
    {{ (scheduled_now | bool and
        (not presence_rule_enabled or office_presence_active | bool))
       or (presence_rule_enabled and not presence_rule_schedule_only
           and office_presence_active | bool) }}

triggers:
  - trigger: homeassistant
    event: start
    id: startup
  - trigger: time_pattern
    minutes: !input refresh_interval
    id: periodic_refresh

actions:
  - choose:
      - conditions:
          - condition: template
            value_template: >-
              {{ vacation_enabled and vacation_alarm != ''
                 and is_state(vacation_alarm, 'armed_vacation') }}
        sequence:
          - action: climate.set_hvac_mode
            target:
              entity_id: !input thermostat_entities
            data:
              hvac_mode: heat
          - action: climate.set_temperature
            target:
              entity_id: !input thermostat_entities
            data:
              temperature: "{{ vacation_temperature | float }}"

      - conditions:
          - condition: template
            value_template: "{{ current_mode == 'Aus' }}"
        sequence:
          - action: climate.set_hvac_mode
            target:
              entity_id: !input thermostat_entities
            data:
              hvac_mode: off

      - conditions:
          - condition: template
            value_template: >-
              {{ expand(window_contacts) | selectattr('state', 'eq', 'on')
                 | list | count > 0 }}
        sequence:
          - action: climate.set_hvac_mode
            target:
              entity_id: !input thermostat_entities
            data:
              hvac_mode: heat
          - action: climate.set_temperature
            target:
              entity_id: !input thermostat_entities
            data:
              temperature: "{{ window_open_temperature | float }}"

      - conditions:
          - condition: template
            value_template: "{{ current_mode == 'Manuell' }}"
        sequence:
          - action: climate.set_hvac_mode
            target:
              entity_id: !input thermostat_entities
            data:
              hvac_mode: heat
          - action: climate.set_temperature
            target:
              entity_id: !input thermostat_entities
            data:
              temperature: "{{ manual_temperature | float }}"

      - conditions:
          - condition: template
            value_template: "{{ current_mode == 'Auto' and use_comfort_temperature }}"
        sequence:
          - action: climate.set_hvac_mode
            target:
              entity_id: !input thermostat_entities
            data:
              hvac_mode: heat
          - action: climate.set_temperature
            target:
              entity_id: !input thermostat_entities
            data:
              temperature: "{{ comfort_temperature | float }}"

      - conditions:
          - condition: template
            value_template: "{{ current_mode == 'Auto' and not use_comfort_temperature }}"
        sequence:
          - action: climate.set_hvac_mode
            target:
              entity_id: !input thermostat_entities
            data:
              hvac_mode: heat
          - action: climate.set_temperature
            target:
              entity_id: !input thermostat_entities
            data:
              temperature: "{{ setback_temperature | float }}"
